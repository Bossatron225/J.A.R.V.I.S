name: JarvisApp
options:
  bundleIdPrefix: com.jameslumsden
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # fill in with your Apple ID's team ID in Xcode's Signing & Capabilities tab

targets:
  JarvisApp:
    type: application
    platform: iOS
    sources:
      - JarvisApp
    info:
      path: JarvisApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Jarvis needs the camera to run its biometric face-lock scan, same as the web dashboard."
        NSMicrophoneUsageDescription: "Jarvis needs the microphone to hear voice commands."
        NSSpeechRecognitionUsageDescription: "Jarvis uses on-device speech recognition to turn your voice into commands."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jameslumsden.JarvisApp
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ENABLE_PREVIEWS: true
